# The Windows release build done on main, so windows-release.yml starts with its crates compiled.
# A cache saved on a release's tag is seen only by that tag, so each release would otherwise build
# everything again; one saved on main is seen by every tag. The cache's workspace, shared-key and
# RUSTFLAGS (part of the cache's key) must stay exactly as windows-release.yml has them.
name: Windows release cache
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package*.json"
      - ".github/workflows/windows-cache.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-cache
  cancel-in-progress: true

jobs:
  build:
    # Not for a push that is only make release's version bump ("Brainstead 1.3.0"): the release
    # builds that itself, and nothing the cache holds has changed. (Brainstead 2 needs its own line.)
    if: github.event_name != 'push' || github.event.commits[1] != null || !startsWith(github.event.head_commit.message, 'Brainstead 1.')
    runs-on: windows-latest
    env:
      # As the release build: the runner's home folder kept out of the binary.
      RUSTFLAGS: --remap-path-prefix=C:\Users\runneradmin=/build --remap-path-scope=object
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      # The release's build, without the installer.
      - run: npx tauri build --no-bundle
