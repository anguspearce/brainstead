# The Windows installer for each release make release publishes from the Mac: built from the
# release's commit, signed with the updater key, and added to the release as
# Brainstead_x64-setup.exe with its entry in latest.json (tools/update_windows.py), so installed
# Windows copies update themselves. For a release made before this existed, or to try again, run it
# from the Actions tab with the tag.
#
# Needs the repository secrets TAURI_SIGNING_PRIVATE_KEY (the contents of the updater's private
# key, the one tools/update_files.py signs the Mac package with) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty for a key without one).
name: Windows release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to add the Windows installer to (v1.3.0)"
        required: true

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # As windows-cache.yml, whose cache this restores (RUSTFLAGS is part of its key).
      RUSTFLAGS: --remap-path-prefix=C:\Users\runneradmin=/build --remap-path-scope=object
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # The crates compiled by windows-cache.yml on main. A cache saved here, on a tag, would be
      # seen by no other release, so nothing is saved.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: windows-release
          save-if: false
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.x" }
      - run: npm ci --no-audit --no-fund
      # The build number Settings › About shows, as make app's.
      - run: |
          $env:BRAINSTEAD_BUILD = Get-Date -Format "yyyyMMdd.HHmmss"
          npx tauri build
      - run: python tools/update_windows.py "$env:TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
