# macOS and Windows run every check (make check on macOS, python tools/check.py on Windows), so
# the Windows port keeps its tests. Linux only compiles, so macOS-only code can't creep in outside
# src-tauri/src/platform (the archived build plan, §2, Cross-platform).
# It runs only when a push changes the app, not for docs, the product page or sift's records alone
# (D-20261008-03), and can be started by hand from the Actions tab.
name: CI
on:
  push:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "_sift/**"
      - "archive/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "site/**"
      - "_sift/**"
      - "archive/**"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: pipx install ruff
      - run: make check

  windows:
    runs-on: windows-latest
    env:
      # The check tooling prints and reads UTF-8; the runner's default console code page is not.
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm ci
      - run: pipx install ruff
      - run: python tools/check.py

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: WebKitGTK and friends
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      # tauri::generate_context! wants the frontend's output folder to exist.
      - run: mkdir dist
      - run: cargo test -p brainstead-core
        working-directory: src-tauri
      - run: cargo check --workspace --all-targets
        working-directory: src-tauri
