[package]
name = "brainstead-core"
version = "0.1.0"
description = "Brainstead's vault parsing, index, tasks and search, with no Tauri dependency"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
regex = "1"
aho-corasick = "1"
sha2 = "0.10"
hex = "0.4"
unicode-normalization = "0.1"
walkdir = "2"
rayon = "1"
notify = "8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.23.1"
similar = "2"
flate2 = "1"
strsim = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }
dunce = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

# The 8.3 short name of a test folder (paths.rs), one of the spellings a path is read back from.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
