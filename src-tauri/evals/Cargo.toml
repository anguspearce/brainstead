[package]
name = "brainstead-evals"
version = "0.1.0"
description = "Brainstead's workflow evals: scenarios on a copy of the fixture vault, with real models"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false
default-run = "brainstead-evals"

[dependencies]
brainstead-core = { path = "../core" }
brainstead-mcp = { path = "../mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
similar = "3"
tempfile = "3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
