[package]
name = "brainstead"
version = "2.5.1"
description = "A home for everything on your mind"
authors = ["Wayne Davies"]
license = "GPL-3.0-or-later"
edition = "2021"
# std::fs::File::lock (nativehost.rs) was stabilised in 1.89.
rust-version = "1.89"

[workspace]
members = ["core", "mcp", "evals"]

[lib]
name = "brainstead_lib"
# rlib only: each extra crate type is another full LTO link.
crate-type = ["rlib"]

# The binary name is what the Dock and Activity Monitor show in `tauri dev`.
[[bin]]
name = "Brainstead"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
brainstead-core = { path = "core" }
brainstead-mcp = { path = "mcp" }
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
dirs = "6"
base64 = "0.22"
regex = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# Teams and Outlook sync's calls (sync/), at the updater's own version.
reqwest = { version = "0.13", features = ["blocking", "json", "form", "query"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The sync's sign-in in the login Keychain (platform/macos.rs), at rustls' own version.
security-framework = "3.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSValue", "NSURL", "NSDictionary", "NSArray", "NSRange", "NSGeometry", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSText", "NSSpellChecker", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSView", "NSResponder", "NSWindow", "NSPanel", "objc2-core-foundation"] }
objc2-quick-look-ui = { version = "0.3", default-features = false, features = ["std", "QLPreviewPanel", "QLPreviewItem", "objc2-app-kit"] }
# Reading aloud (platform/speech.rs) and the media keys with Now Playing (platform/now_playing.rs).
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPRemoteCommandCenter", "MPRemoteCommand", "MPRemoteCommandEvent", "MPNowPlayingInfoCenter", "MPMediaItem"] }
block2 = "0.6"

[target.'cfg(not(target_os = "macos"))'.dependencies]
pdf-extract = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

# A second launch focuses the running copy (lib.rs). Not on macOS, where LaunchServices already
# keeps one copy of the bundle and a second binary started directly (`make dev`, screenshots) is
# meant to run beside the installed app.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# The capture host's registration and Open at login (HKCU), and rich copy (platform/other.rs).
# arboard is the clipboard plugin's own, at its version.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
arboard = { version = "3.6", default-features = false }
# Export PDF through WebView2's PrintToPdf (platform/mod.rs), at tauri's own versions; the paper
# size from the user's locale.
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# Spelling (Windows' spell checker) and grammar (Harper, on the PC), as Two-edged Sword's journal
# has them (platform/spell_win.rs).
# The text in images and the copy a model is shown, through Windows' imaging and text
# recognition (platform/image_win.rs).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "Win32_Security_Credentials"] }
windows-future = "0.3"
harper-core = { version = "2", default-features = false, features = ["concurrent"] }

[dev-dependencies]
tempfile = "3"
# tauri's MockRuntime, to build the menu bar in a test (menu.rs).
tauri = { version = "2", features = ["test"] }

# Thin LTO with parallel codegen units: incremental release builds in ~20s instead of minutes.
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
# Unwind, not abort: the vault watcher and the commands catch a panic on one bad file and carry on;
# with abort any panic anywhere would quit the app.
panic = "unwind"
strip = true

# `make dev` and `make check` rebuild constantly; debug info for every dependency is most of
# the link time and nobody steps through them in a debugger here.
[profile.dev]
debug = "line-tables-only"
# Packed into a .dSYM at link: unpacked (macOS's default) leaves every object file in target/debug/deps,
# tens of thousands per build of the core, and target grew to 25 GB.
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 2

# The core's checks, index and parsers run over the whole vault: unoptimised, Knowledge health's
# rerun takes seconds in the dev build (7 s against 1 s on a 2,000-file vault).
[profile.dev.package.brainstead-core]
opt-level = 2

# Not for the tests, which make check builds and which would wait on the optimiser for little gain.
[profile.test.package.brainstead-core]
opt-level = 0
