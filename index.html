<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brainstead</title>
    <!--
      Inline splash: paints as soon as the webview does and covers the wait for the first screen.
      Keep the colours in step with --ground, --ink, --ink3, --line and --accent in src/styles.css.
    -->
    <script>
      try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <style>
      :root { color-scheme: light dark; --splash-bg: #fafbfc; --splash-fg: #151a22; --splash-dim: #626c7a; --splash-line: #e3e7ed; --splash-accent: #1d5fd6; }
      @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --splash-bg: #16181c; --splash-fg: #e8ebf0; --splash-dim: #858d99; --splash-line: #2c3038; --splash-accent: #2f6fdb; } }
      :root[data-theme="dark"] { --splash-bg: #16181c; --splash-fg: #e8ebf0; --splash-dim: #858d99; --splash-line: #2c3038; --splash-accent: #2f6fdb; }
      html, body { margin: 0; background: var(--splash-bg); }
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--splash-bg); color: var(--splash-fg); font: 13px/1.4 "Geist Variable", -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; transition: opacity .2s ease-out; -webkit-user-select: none; user-select: none; }
      #splash.gone { opacity: 0; pointer-events: none; }
      #splash .brand { display: flex; align-items: center; gap: 16px; animation: rise .4s ease-out both; }
      #splash .name { font-family: "Geist Variable", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; font-weight: 650; letter-spacing: -0.03em; font-size: 56px; line-height: 1; }
      #splash .name i { font-style: normal; color: var(--splash-accent); }
      #splash .tagline { font-size: 17px; color: var(--splash-dim); letter-spacing: -0.01em; animation: rise .4s .08s ease-out both; }
      #splash .bar { width: 152px; height: 3px; border-radius: 99px; background: var(--splash-line); overflow: hidden; margin-top: 10px; }
      #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 99px; background: var(--splash-accent); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { #splash .brand, #splash .tagline, #splash .bar i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash">
      <!-- The mark (Mark in src/icons.tsx, design/mark.svg): a house holding a brain. -->
      <div class="brand">
        <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 15 16 4.5 28 15v11a2.5 2.5 0 0 1-2.5 2.5h-19A2.5 2.5 0 0 1 4 26z" fill="var(--splash-accent)" />
          <path d="M15.4 14.3c-.9-.7-2.4-.7-3.2.2-1.5-.2-2.8 1-2.6 2.5-1.2.6-1.6 2.1-.9 3.2-.6 1.2-.1 2.7 1.2 3.1.2 1.4 1.6 2.3 3 1.9.7.7 1.7.9 2.5.4V14.3zM16.6 14.3c.9-.7 2.4-.7 3.2.2 1.5-.2 2.8 1 2.6 2.5 1.2.6 1.6 2.1.9 3.2.6 1.2.1 2.7-1.2 3.1-.2 1.4-1.6 2.3-3 1.9-.7.7-1.7.9-2.5.4V14.3z" fill="#fff" />
          <path d="M12.4 17.6c.7-.6 1.8-.4 2.1.4M11.2 20.4c.6.6 1.7.6 2.2 0 .4.7 1.3 1 2 .6M12.6 23.2c.3-.7 1.1-1 1.8-.7M19.6 17.6c-.7-.6-1.8-.4-2.1.4M20.8 20.4c-.6.6-1.7.6-2.2 0-.4.7-1.3 1-2 .6M19.4 23.2c-.3-.7-1.1-1-1.8-.7" stroke="var(--splash-accent)" stroke-width=".9" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="name">Brainstead</span>
      </div>
      <div class="tagline">A home for everything on your mind.</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
